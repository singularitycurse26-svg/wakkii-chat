<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wakkii Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0f;
  --surface: #1a1a2e;
  --accent: #E91E63;
  --accent2: #9C27B0;
  --text: #ffffff;
  --muted: #8888aa;
  --agent: #00e676;
  --user: #2196F3;
}
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chat-header {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.chat-header .logo {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.chat-header h1 { font-size: 16px; font-weight: 600; }
.chat-header .status {
  font-size: 11px; opacity: 0.8; margin-top: 2px;
}
.chat-header .devin-badge {
  margin-left: auto;
  background: rgba(255,255,255,0.15);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 10px;
  display: flex; align-items: center; gap: 4px;
}
.chat-header .devin-badge.connected { background: rgba(0,230,118,0.2); color: var(--agent); }

.room-selector {
  background: var(--surface);
  padding: 8px 12px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  overflow-x: auto;
}
.room-selector .label {
  font-size: 11px; color: var(--muted); white-space: nowrap;
}
.room-tab {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--muted);
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.room-tab:hover { background: rgba(255,255,255,0.1); }
.room-tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  border-color: transparent;
}
.room-tab.cline { border-color: #00e676; }
.room-tab.cline.active { background: linear-gradient(135deg, #00e676, #00b8d4); }
.room-tab .dot {
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; margin-right: 4px;
  background: var(--muted);
}
.room-tab.active .dot { background: white; }
.room-tab.cline .dot { background: #00e676; }

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track { background: var(--surface); }
.chat-messages::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

.msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.4;
  word-wrap: break-word;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.msg.user {
  align-self: flex-end;
  background: var(--user);
  color: white;
  border-bottom-right-radius: 4px;
}
.msg.agent {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--agent);
  color: var(--agent);
  border-bottom-left-radius: 4px;
}
.msg.system {
  align-self: center;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
.msg .sender { font-size: 10px; opacity: 0.7; margin-bottom: 2px; }
.msg .time { font-size: 9px; opacity: 0.5; margin-top: 4px; }

.chat-input {
  display: flex;
  padding: 12px;
  gap: 8px;
  background: var(--surface);
  flex-shrink: 0;
}
.chat-input input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--accent2);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
.chat-input input:focus { border-color: var(--accent); }
.chat-input button {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: transform 0.2s;
}
.chat-input button:hover { transform: scale(1.05); }
.chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }

.typing {
  align-self: flex-start;
  color: var(--muted);
  font-size: 12px;
  padding: 8px 14px;
  display: none;
}
.typing.active { display: block; }
.typing span {
  display: inline-block;
  animation: bounce 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

/* Auth screen — built like Soulmate OS */
.auth-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg); z-index: 100000;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Segoe UI', -apple-system, sans-serif;
}
.auth-screen.hidden { display: none; }
.auth-card {
  width: 100%; max-width: 380px; padding: 32px 28px;
  background: var(--surface); border-radius: 20px;
  border: 1px solid var(--accent2);
  box-shadow: 0 8px 32px rgba(233,30,99,0.2);
}
.auth-logo {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; margin: 0 auto 16px;
}
.auth-title {
  font-size: 24px; font-weight: 700; text-align: center;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.auth-subtitle {
  font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 24px;
}
.auth-label {
  font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block;
}
.auth-input {
  width: 100%; background: var(--bg); border: 1px solid var(--accent2);
  color: var(--text); padding: 12px 14px; border-radius: 12px;
  font-size: 14px; outline: none; margin-bottom: 16px;
}
.auth-input:focus { border-color: var(--accent); }
.auth-btn {
  width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white; border: none; padding: 12px; border-radius: 12px;
  font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px;
  transition: transform 0.2s;
}
.auth-btn:hover { transform: scale(1.02); }
.auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.auth-btn-secondary {
  width: 100%; background: transparent; color: var(--muted);
  border: 1px solid var(--accent2); padding: 12px; border-radius: 12px;
  font-size: 14px; cursor: pointer; transition: all 0.2s;
}
.auth-btn-secondary:hover { background: var(--bg); color: var(--text); }
.auth-error {
  background: rgba(244,67,54,0.1); border: 1px solid #f44336;
  color: #f44336; padding: 10px 14px; border-radius: 10px;
  font-size: 13px; margin-bottom: 16px; display: none;
}
.auth-error.show { display: block; }
.auth-founder-badge {
  background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(233,30,99,0.2));
  border: 1px solid #FFD700; color: #FFD700;
  padding: 8px 14px; border-radius: 10px; font-size: 12px;
  text-align: center; margin-bottom: 16px; display: none;
}
.auth-founder-badge.show { display: block; }
.auth-toggle {
  text-align: center; font-size: 13px; color: var(--muted); margin-top: 12px;
}
.auth-toggle a {
  color: var(--accent); cursor: pointer; text-decoration: none;
}
.auth-toggle a:hover { text-decoration: underline; }
.auth-loading {
  text-align: center; color: var(--muted); font-size: 14px; padding: 20px;
}
</style>
</head>
<body>

<!-- Auth Screen (login/signup) — appears before chat UI -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">🤖</div>
    <div class="auth-title" id="authTitle">Wakkii Chat</div>
    <div class="auth-subtitle" id="authSubtitle">AI Agent Ecosystem — Sign in to continue</div>

    <div class="auth-founder-badge" id="authFounderBadge">
      👑 Founder Account — All features free forever
    </div>

    <div class="auth-error" id="authError"></div>

    <div id="authLoginForm">
      <label class="auth-label">Email</label>
      <input type="email" class="auth-input" id="authEmail" placeholder="you@example.com" autocomplete="email">

      <label class="auth-label">Password</label>
      <input type="password" class="auth-input" id="authPassword" placeholder="Your password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()">

      <button class="auth-btn" id="authLoginBtn" onclick="doLogin()">Log In</button>
      <button class="auth-btn-secondary" onclick="showSignup()">Create Account</button>
      <div class="auth-toggle">
        New here? <a onclick="showSignup()">Sign up</a>
      </div>
    </div>

    <div id="authSignupForm" style="display:none">
      <label class="auth-label">Email</label>
      <input type="email" class="auth-input" id="signupEmail" placeholder="you@example.com" autocomplete="email">

      <label class="auth-label">Password (min 8 characters)</label>
      <input type="password" class="auth-input" id="signupPassword" placeholder="Create a password" autocomplete="new-password">

      <label class="auth-label">Confirm Password</label>
      <input type="password" class="auth-input" id="signupPassword2" placeholder="Repeat password" autocomplete="new-password"
             onkeydown="if(event.key==='Enter')doSignup()">

      <button class="auth-btn" id="authSignupBtn" onclick="doSignup()">Sign Up</button>
      <button class="auth-btn-secondary" onclick="showLogin()">Back to Login</button>
    </div>

    <div id="authLoading" style="display:none">
      <div class="auth-loading">Please wait...</div>
    </div>
  </div>
</div>

<!-- Main Chat UI (hidden until logged in) -->
<div id="chatApp" style="display:none; height:100vh; flex-direction:column;">
  <div class="logo">🤖</div>
  <div>
    <h1 id="roomTitle">Wakkii Chat</h1>
    <div class="status" id="status">Connecting...</div>
  </div>
  <div class="devin-badge" id="devinBadge"> Devin</div>
</div>

<div class="room-selector" id="roomSelector">
  <span class="label">Rooms:</span>
  <div class="room-tab cline active" data-room="CLINE"><span class="dot"></span>Cline</div>
  <div class="room-tab" data-room="AGENT-1"><span class="dot"></span>Agent 1</div>
  <div class="room-tab" data-room="AGENT-2"><span class="dot"></span>Agent 2</div>
  <div class="room-tab" data-room="AGENT-3"><span class="dot"></span>Agent 3</div>
</div>

<div class="chat-messages" id="messages">
  <div class="msg system">Connecting to Wakkii Chat...</div>
</div>
<div class="typing" id="typing"><span>●</span><span>●</span><span>●</span> Agent is working</div>

<div class="chat-input">
  <input type="text" id="input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">Send</button>
</div>

</div><!-- /chatApp -->

<script>
// --- Configuration ---
const API_BASE = window.WAKKII_API || '';
let ROOM_ID = window.WAKKII_ROOM || 'CLINE';
let USER_NAME = window.WAKKII_USER || 'User';
const POLL_INTERVAL = 3000;

let lastCount = 0;
let isTyping = false;
let roomMessages = {}; // cache per room
let sessionToken = localStorage.getItem('wakkii_session_token') || '';
let isFounder = localStorage.getItem('wakkii_is_founder') === 'true';
let userEmail = localStorage.getItem('wakkii_email') || '';

// --- Auth ---
const authScreen = document.getElementById('authScreen');
const chatApp = document.getElementById('chatApp');
const authError = document.getElementById('authError');
const authFounderBadge = document.getElementById('authFounderBadge');

function showAuthError(msg) {
  authError.textContent = msg;
  authError.classList.add('show');
  setTimeout(() => authError.classList.remove('show'), 5000);
}

function showLogin() {
  document.getElementById('authLoginForm').style.display = 'block';
  document.getElementById('authSignupForm').style.display = 'none';
  document.getElementById('authLoading').style.display = 'none';
  document.getElementById('authTitle').textContent = 'Wakkii Chat';
  document.getElementById('authSubtitle').textContent = 'AI Agent Ecosystem — Sign in to continue';
}

function showSignup() {
  document.getElementById('authLoginForm').style.display = 'none';
  document.getElementById('authSignupForm').style.display = 'block';
  document.getElementById('authLoading').style.display = 'none';
  document.getElementById('authTitle').textContent = 'Create Account';
  document.getElementById('authSubtitle').textContent = 'Sign up with email and password';
}

async function doLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { showAuthError('Enter email and password'); return; }

  document.getElementById('authLoginForm').style.display = 'none';
  document.getElementById('authLoading').style.display = 'block';

  try {
    const resp = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await resp.json();

    if (data.status === 'ok') {
      sessionToken = data.session_token;
      isFounder = data.is_founder;
      userEmail = email.toLowerCase();
      localStorage.setItem('wakkii_session_token', sessionToken);
      localStorage.setItem('wakkii_is_founder', isFounder ? 'true' : 'false');
      localStorage.setItem('wakkii_email', userEmail);
      USER_NAME = userEmail.split('@')[0];
      enterChat();
    } else {
      showLogin();
      showAuthError(data.detail || 'Login failed');
    }
  } catch (e) {
    const isLocalFounder = await localFounderCheck(email, password);
    if (isLocalFounder) {
      sessionToken = generateLocalToken();
      isFounder = true;
      userEmail = email.toLowerCase();
      localStorage.setItem('wakkii_session_token', sessionToken);
      localStorage.setItem('wakkii_is_founder', 'true');
      localStorage.setItem('wakkii_email', userEmail);
      USER_NAME = userEmail.split('@')[0];
      enterChat();
    } else {
      showLogin();
      showAuthError('Server offline. Founder login only.');
    }
  }
}

async function doSignup() {
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const password2 = document.getElementById('signupPassword2').value;

  if (!email.includes('@')) { showAuthError('Enter a valid email'); return; }
  if (password.length < 8) { showAuthError('Password must be 8+ characters'); return; }
  if (password !== password2) { showAuthError('Passwords don\'t match'); return; }

  document.getElementById('authSignupForm').style.display = 'none';
  document.getElementById('authLoading').style.display = 'block';

  try {
    const resp = await fetch(`${API_BASE}/auth/signup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await resp.json();

    if (data.status === 'created') {
      sessionToken = data.session_token;
      isFounder = false;
      userEmail = email.toLowerCase();
      localStorage.setItem('wakkii_session_token', sessionToken);
      localStorage.setItem('wakkii_is_founder', 'false');
      localStorage.setItem('wakkii_email', userEmail);
      USER_NAME = userEmail.split('@')[0];
      enterChat();
    } else {
      showSignup();
      showAuthError(data.detail || 'Signup failed');
    }
  } catch (e) {
    showSignup();
    showAuthError('Cannot connect to server');
  }
}

async function localFounderCheck(email, password) {
  const FOUNDER_EMAIL = 'hawpetossjustin25@gmail.com';
  const FOUNDER_HASH = 'add3e2d64e2a04bfe4cc9606612d20a74706737fbbff433e0e262cc59735cc96';
  if (email.toLowerCase() !== FOUNDER_EMAIL) return false;
  const buf = new TextEncoder().encode(password);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  const hex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  return hex === FOUNDER_HASH;
}

function generateLocalToken() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}

function enterChat() {
  authScreen.classList.add('hidden');
  chatApp.style.display = 'flex';
  if (isFounder) {
    authFounderBadge.classList.add('show');
  }
  checkConnection();
  fetchMessages();
  setInterval(fetchMessages, POLL_INTERVAL);
  setInterval(checkConnection, 30000);
  inputEl.focus();
}

async function checkExistingSession() {
  if (!sessionToken) { return; }
  try {
    const resp = await fetch(`${API_BASE}/auth/check_session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_token: sessionToken })
    });
    const data = await resp.json();
    if (data.status === 'valid') {
      userEmail = data.email || userEmail;
      isFounder = data.is_founder || isFounder;
      USER_NAME = userEmail.split('@')[0];
      enterChat();
    } else {
      localStorage.removeItem('wakkii_session_token');
      sessionToken = '';
    }
  } catch (e) {
    if (isFounder && sessionToken) {
      enterChat();
    }
  }
}

// Start — check session or show login
if (sessionToken) {
  checkExistingSession();
}

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const typingEl = document.getElementById('typing');
const statusEl = document.getElementById('status');
const devinBadge = document.getElementById('devinBadge');
const roomTitle = document.getElementById('roomTitle');
const roomSelector = document.getElementById('roomSelector');

// Room switching
roomSelector.addEventListener('click', (e) => {
  const tab = e.target.closest('.room-tab');
  if (!tab) return;
  const room = tab.dataset.room;
  if (room === ROOM_ID) return;
  switchRoom(room);
});

function switchRoom(room) {
  ROOM_ID = room;
  lastCount = roomMessages[room] || 0;
  messagesEl.innerHTML = '<div class="msg system">Switched to ' + room + '</div>';
  document.querySelectorAll('.room-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.room === room);
  });
  roomTitle.textContent = room === 'CLINE' ? 'Cline — Front Desk' : room;
  fetchMessages();
}

// Auto-scroll only when near bottom
let userScrolled = false;
messagesEl.addEventListener('scroll', () => {
  const dist = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
  userScrolled = dist > 80;
});

function scrollToBottom() {
  if (!userScrolled) messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(sender, text, ts) {
  const isAgent = sender === 'Wakkii Agent' || sender.includes('Agent') || sender === 'Cline';
  const cls = isAgent ? 'agent' : (sender === 'system' ? 'system' : 'user');
  const div = document.createElement('div');
  div.className = `msg ${cls}`;
  const time = ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
  div.innerHTML = `<div class="sender">${sender}</div>${escapeHtml(text)}<div class="time">${time}</div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function fetchMessages() {
  try {
    const resp = await fetch(`${API_BASE}/wakkii/rooms/${ROOM_ID}/messages`);
    const data = await resp.json();
    const msgs = data.messages || [];
    if (msgs.length > lastCount) {
      const newMsgs = msgs.slice(lastCount);
      lastCount = msgs.length;
      roomMessages[ROOM_ID] = lastCount;
      for (const msg of newMsgs) {
        addMessage(msg.sender, msg.text, msg.timestamp);
        if (msg.sender === 'Wakkii Agent' || msg.sender.includes('Agent') || msg.sender === 'Cline') {
          isTyping = false;
          typingEl.classList.remove('active');
        }
      }
    } else if (lastCount === 0 && msgs.length > 0) {
      lastCount = msgs.length;
      roomMessages[ROOM_ID] = lastCount;
    }
  } catch (e) {
    statusEl.textContent = 'Disconnected — waiting for server...';
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  userScrolled = false;

  addMessage(USER_NAME, text, new Date().toISOString());
  isTyping = true;
  typingEl.classList.add('active');

  try {
    await fetch(`${API_BASE}/wakkii/rooms/${ROOM_ID}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sender: USER_NAME, text, timestamp: new Date().toISOString() })
    });
  } catch (e) {
    addMessage('system', 'Failed to send — is the server running?', null);
    isTyping = false;
    typingEl.classList.remove('active');
  }
}

// Check connection
async function checkConnection() {
  try {
    const resp = await fetch(`${API_BASE}/health`);
    if (resp.ok) {
      statusEl.textContent = 'Online';
      statusEl.style.color = 'var(--agent)';
      try {
        const devinResp = await fetch(`${API_BASE}/devin/status`);
        if (devinResp.ok) {
          const devinData = await devinResp.json();
          if (devinData.connected) {
            devinBadge.classList.add('connected');
            devinBadge.textContent = '✓ Devin Connected';
          }
        }
      } catch (e) {}
    }
  } catch (e) {
    statusEl.textContent = 'Offline';
    statusEl.style.color = '#f44336';
  }
}

// Initialize handled by enterChat() after auth
</script>

<!-- V-103 Radio Widget (separate floating widget, bottom-left) -->
<script src="radio-widget.js"></script>
</body>
</html>
